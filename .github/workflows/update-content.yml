name: Update content (YouTube feed)

on:
  schedule:
    - cron: '0 5,17 * * *'   # 2x taeglich (05:00 & 17:00 UTC)
  workflow_dispatch:          # manueller Start moeglich

permissions:
  contents: write

concurrency:
  group: content-update
  cancel-in-progress: false

jobs:
  youtube:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest YouTube videos
        run: node scripts/fetch-youtube.mjs
        env:
          YT_CHANNEL_ID: UCIkUWT8IvWdasBUywWY22OA

      - name: Sync race calendar (Google Calendar)
        run: node scripts/fetch-calendar.mjs
        env:
          CAL_ID: c85316707e0d0ebbd69c12525428113663d38ccb078380cfe40a8559f0dedc9f@group.calendar.google.com

      - name: Commit changes if any
        run: |
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git config user.name  "innisar-bot"
            git config user.email "actions@github.com"
            git add data/
            git commit -m "chore: update content (YouTube + Kalender) [skip ci]"
            git push
          else
            echo "No content changes"
          fi
